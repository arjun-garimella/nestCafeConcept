<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | The Nest Cafe</title>
  <meta name="description" content="This page doesn't exist. Head back to The Nest Cafe for the menu, hours and directions in Frisco, TX." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1B140E" />
  <!-- Root-relative paths: a host serves this page at any missing URL, so relative links would break -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Young+Serif&amp;display=swap" rel="stylesheet" />

  <style>
    :root { --cream: #FBF6EC; --honey: #EBC46A; --night: #1B140E; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
      font-family: Figtree, system-ui, sans-serif; color: var(--cream); background: var(--night);
      -webkit-font-smoothing: antialiased;
    }
    .bg { position: fixed; inset: 0; z-index: -2;
          background: #2A1E15 url("https://images.unsplash.com/photo-1664192578366-523c01b7ce43?auto=format&fit=crop&w=1600&h=1000&q=60") center / cover;
          filter: blur(3px) saturate(1.05); transform: scale(1.08); animation: drift 24s ease-in-out infinite alternate; }
    .shade { position: fixed; inset: 0; z-index: -1;
             background: radial-gradient(ellipse at 50% 30%, rgba(255,186,96,.24), transparent 60%),
                         radial-gradient(ellipse at center, rgba(27,20,14,.74), rgba(27,20,14,.95) 75%); }
    @keyframes drift { to { transform: scale(1.16) translate(-1.5%, -1%); } }

    main { position: relative; width: min(100% - 32px, 640px); text-align: center; padding: 48px 0; }
    .code { font-family: "Young Serif", Georgia, serif; line-height: 1;
            font-size: clamp(7rem, 30vw, 13rem); letter-spacing: -.03em;
            filter: drop-shadow(0 18px 40px rgba(0,0,0,.5)); }
    /* gradient lives on each glyph: background-clip:text on the parent skips inline-block children */
    .code span { display: inline-block; animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
                 background: linear-gradient(180deg, #F3D58C 0%, #D9A93F 50%, #A9781F 100%);
                 -webkit-background-clip: text; background-clip: text; color: transparent; }
    .code span:nth-child(2) { animation-delay: .08s; }
    .code span:nth-child(3) { animation-delay: .16s; }
    /* the zero is an egg: it left the nest */
    .code .egg { background: linear-gradient(180deg, #FFFDF8 0%, #F1E4CB 60%, #D9C29A 100%); -webkit-background-clip: text; background-clip: text; }
    @keyframes rise { from { opacity: 0; transform: translateY(40%) rotate(6deg); filter: blur(8px); } }

    h1 { margin-top: 12px; font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15;
         animation: fade .9s .35s ease both; }
    p.lead { margin: 14px auto 0; max-width: 30rem; font-size: 1.0625rem; line-height: 1.6; color: rgba(251,246,236,.8);
             animation: fade .9s .5s ease both; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; animation: fade .9s .65s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } }

    .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
           min-height: 48px; padding: 0 26px; border-radius: 999px; font-weight: 600; font-size: 1rem; text-decoration: none;
           transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
    .btn:hover { transform: translateY(-2px) scale(1.03); }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--honey); outline-offset: 3px; }
    .btn-gold { color: #2A1E15; background: linear-gradient(180deg, #F8E3A8, #E2B654 55%, #C1902C);
                box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 14px 28px -10px rgba(193,144,44,.6); }
    .btn-glass { color: var(--cream); background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
                 border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                 box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
    .call { margin-top: 28px; font-size: .9375rem; color: rgba(251,246,236,.68); animation: fade .9s .8s ease both; }
    .call a { color: var(--honey); font-weight: 600; text-decoration: none; }
    .call a:hover { text-decoration: underline; }
    .call a:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; border-radius: 4px; }

    /* drifting crumbs */
    .crumb { position: fixed; top: -20px; width: 8px; height: 6px; border-radius: 45% 55% 50% 40%;
             background: linear-gradient(160deg, #F3D58C, #A9781F); opacity: .85; pointer-events: none;
             animation: fall linear infinite; }
    @keyframes fall { to { transform: translate3d(var(--dx, 20px), 110vh, 0) rotate(540deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .crumb { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <main>
    <div class="code" aria-hidden="true"><span>4</span><span class="egg">0</span><span>4</span></div>
    <h1>This page flew the nest.</h1>
    <p class="lead">We couldn't find the page you're after. The menu, hours and directions are all on the home page.</p>
    <div class="actions">
      <a class="btn btn-gold" href="/">Back to the Nest</a>
      <a class="btn btn-glass" href="/#menu">See the menu</a>
    </div>
    <p class="call">Need a hand? Call us at <a href="tel:+14695794790">469-579-4790</a></p>
  </main>

  <script>
    // A few warm crumbs drifting down (skipped for reduced motion)
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      for (let i = 0; i < 18; i++) {
        const c = document.createElement('i');
        c.className = 'crumb';
        c.setAttribute('aria-hidden', 'true');
        const s = 4 + Math.random() * 7;
        c.style.cssText = `left:${Math.random() * 100}vw;width:${s}px;height:${s * .75}px;` +
          `animation-duration:${7 + Math.random() * 8}s;animation-delay:${-Math.random() * 15}s;--dx:${(Math.random() - .5) * 120}px`;
        document.body.appendChild(c);
      }
    }
  </script>
</body>
</html>
